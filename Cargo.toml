[workspace]
resolver = "3"
members = [
    "crates/mh-overlay-memory",
    "crates/mh-overlay-games",
    "crates/mh-overlay-config",
    "crates/mh-overlay-ui",
    "crates/mh-overlay-app",
    "crates/mh-overlay-cli",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/SyberFoxx/mh-overlay"
authors = ["Ramses Sotomayor"]

[workspace.dependencies]
mh-overlay-memory = { path = "crates/mh-overlay-memory" }
mh-overlay-games = { path = "crates/mh-overlay-games" }
mh-overlay-config = { path = "crates/mh-overlay-config" }
mh-overlay-ui = { path = "crates/mh-overlay-ui" }
mh-overlay-app = { path = "crates/mh-overlay-app" }
libc = "0.2"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
strip = true
