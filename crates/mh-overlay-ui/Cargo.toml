[package]
name = "mh-overlay-ui"
description = "Panel del overlay: dibujo en un lienzo propio y ventana X11"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mh-overlay-config = { workspace = true }
mh-overlay-games = { workspace = true }
# fontdue: rasteriza la tipografía incluida a un mapa de cobertura; dibujar texto sin esto
# significa escribir un motor de fuentes.
fontdue = "0.9"
# x11rb: protocolo X11 puro en Rust, sin enlazar libX11 ni exigir cabeceras para compilar.
# Los juegos de Proton pueden ser ventanas XWayland, así que el panel tiene que saber hablar X11.
x11rb = { version = "0.13", features = ["shape"] }
# wayland-client + layer shell WLR: en una sesión Wayland el compositor dibuja el juego
# fullscreen por encima de cualquier ventana X11, incluso de las override-redirect. La capa
# `overlay` de wlr-layer-shell es la única que un compositor pone sobre un fullscreen, y es el
# mismo mecanismo de las notificaciones del escritorio.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
libc = { workspace = true }
thiserror = { workspace = true }
