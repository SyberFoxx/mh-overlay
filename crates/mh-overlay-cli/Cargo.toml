[package]
name = "mh-overlay-cli"
description = "Binario mh-overlay: lee y muestra el estado de los monstruos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "mh-overlay"
path = "src/main.rs"

[dependencies]
mh-overlay-games.workspace = true
mh-overlay-memory.workspace = true
mh-overlay-config.workspace = true
mh-overlay-ui.workspace = true
mh-overlay-app.workspace = true
clap.workspace = true
thiserror.workspace = true
# minisign-verify: comprobar la firma Ed25519 de la release sin invocar el binario `minisign`,
# que no viene en ningún escritorio base y convertiría «actualizar» en «instala un paquete
# antes». El crate es del autor de minisign y no tiene dependencias transitivas.
minisign-verify = "0.3"
