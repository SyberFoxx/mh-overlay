name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Un tag puede apuntar a un commit que nunca pasó por CI. Publicar sin comprobarlo es
      # además firmar un artefacto que no se sabe si funciona.
      - name: Formato, avisos y tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Dependencias gráficas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev pkg-config \
            appstream desktop-file-utils

      - name: Comprobar versión de la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::La etiqueta v$tag no coincide con la versión $version de Cargo.toml"
            exit 1
          fi
          echo "etiqueta y versión coinciden: $version"

      - name: Comprobar notas de la versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          python3 scripts/release_notes.py "$version" /tmp/release-notes.md

      - name: Validar metadatos
        run: |
          appstreamcli validate --no-net packaging/io.github.syberfoxx.mh_overlay.appdata.xml
          desktop-file-validate packaging/mh-overlay.desktop packaging/mh-overlay-appimage.desktop

      - name: Compilar y empaquetar
        run: ./scripts/package.sh

      - name: Empaquetar AppImage
        run: ./scripts/appimage.sh

      # Firma opcional: se activa cuando el repositorio define el secreto
      # `MINISIGN_SECRET_KEY` con el contenido del archivo privado. Para generarlo sin
      # contraseña (el runner no puede escribirla):
      #   minisign -G -W -p minisign.pub -s minisign.key
      #   gh secret set MINISIGN_SECRET_KEY < minisign.key
      # y publica `minisign.pub` junto a la release para que se pueda verificar.
      - name: Firmar artefactos
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::notice::MINISIGN_SECRET_KEY no está definido; la release sale sin firma."
            exit 0
          fi
          sudo apt-get install -y minisign
          key=$(mktemp)
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          for file in dist/*.AppImage dist/*.tar.gz; do
            minisign -S -s "$key" -m "$file" -x "$file.minisig"
          done
          rm -f "$key"

      # Lo que se publica tiene que verificar con la clave que va compilada en el binario; si el
      # paso de firma se rompe, se ve aquí y no en la máquina de quien actualiza.
      - name: Comprobar que los artefactos firmados verifican
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ ! -f packaging/minisign.pub ]; then
            echo "::error::falta packaging/minisign.pub"
            exit 1
          fi
          for file in dist/*.AppImage dist/*.tar.gz; do
            minisign -V -q -m "$file" -x "$file.minisig" -p packaging/minisign.pub
            echo "verifica: $file"
          done

      # La clave pública viaja con la release para que cualquiera pueda verificar a mano lo que
      # el actualizador verifica solo: `minisign -Vm <archivo> -P <clave>`.
      - name: Publicar la clave pública
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp packaging/minisign.pub dist/minisign.pub

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mh-overlay-linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.sha256
            dist/*.minisig
            dist/minisign.pub

      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.sha256
            dist/*.minisig
            dist/minisign.pub
