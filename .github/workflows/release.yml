name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Dependencias gráficas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev pkg-config \
            appstream desktop-file-utils

      - name: Comprobar versión de la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::La etiqueta v$tag no coincide con la versión $version de Cargo.toml"
            exit 1
          fi
          echo "etiqueta y versión coinciden: $version"

      - name: Comprobar notas de la versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          python3 scripts/release_notes.py "$version" /tmp/release-notes.md

      - name: Validar metadatos
        run: |
          appstreamcli validate --no-net packaging/io.github.syberfoxx.mh_overlay.appdata.xml
          desktop-file-validate packaging/mh-overlay.desktop packaging/mh-overlay-appimage.desktop

      - name: Compilar y empaquetar
        run: ./scripts/package.sh

      - name: Empaquetar AppImage
        run: ./scripts/appimage.sh

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mh-overlay-linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.sha256

      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.sha256
