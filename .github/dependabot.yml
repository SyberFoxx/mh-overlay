version: 2

updates:
  # Los parches y versiones menores llegan agrupados: una PR por semana como mucho, y las
  # mayores separadas porque cambian API y necesitan una lectura del código.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      cargo-menor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
